name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Refresh play/ (a built copy, so a Pages-from-branch setup still serves the game)
        run: |
          rm -rf play && mkdir play && cp -r dist/. play/ && rm -f play/assets/*.map
          if [ -n "$(git status --porcelain play)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add play
            git commit -m "build: refresh play/ [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test the live site (it must be the built game, not the raw source)
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for i in 1 2 3 4 5 6; do
            sleep 15
            html=$(curl -fsSL "${url}?smoke=$RANDOM" || true)
            if echo "$html" | grep -q '/assets/index-' && ! echo "$html" | grep -q '/src/main.ts'; then
              echo "The live site is serving the built game."
              exit 0
            fi
            # Pages-from-branch publishes the raw index.html, which redirects to the committed build in play/
            play=$(curl -fsSL "${url}play/?smoke=$RANDOM" || true)
            if echo "$html" | grep -q '/src/main.ts' && echo "$play" | grep -q '/assets/index-'; then
              echo "The raw page is live, but it redirects to the built copy in play/, so the game works."
              exit 0
            fi
          done
          echo "::error::The live site is not serving the built game. If Pages is set to 'Deploy from a branch', GitHub publishes the raw repository and visitors see a white page. Set Settings > Pages > Build and deployment > Source to 'GitHub Actions'."
          exit 1
